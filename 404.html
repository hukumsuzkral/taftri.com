  <style>
    .hata {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 48px 0;
    }
    .hata__ic { max-width: 640px; margin: 0 auto; text-align: center; }
    .hata__kod {
      font-size: clamp(64px, 16vw, 132px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(120deg, var(--gold), var(--gold-lt));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 8px;
    }
    .hata__baslik { font-size: clamp(24px, 5vw, 34px); margin: 0 0 12px; }
    .hata__metin { color: var(--text-2); margin: 0 0 28px; line-height: 1.6; }
    .hata__butonlar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .hata__linkler {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      justify-content: center;
      font-size: 14.5px;
    }
    .hata__linkler a { color: var(--text-3); }
    .hata__linkler a:hover { color: var(--gold-lt); }
    .hata__marka {
      display: inline-block;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 26px;
      color: var(--text);
    }
    .hata__marka span { color: var(--gold); }
  </style>
</head>

<body>

  <main class="hata">
    <div class="container">
      <div class="hata__ic">
        <a class="hata__marka" href="/">taf<span>tri</span></a>

        <p class="hata__kod">404</p>
        <h1 class="hata__baslik">Bu sayfa bulunamadı</h1>
        <p class="hata__metin">
          Adres değişmiş, yazım hatası olmuş ya da sayfa kaldırılmış olabilir.
          Aşağıdaki bağlantılardan devam edebilirsiniz.
        </p>

        <div class="hata__butonlar">
          <a href="/" class="btn btn-primary magnetic">Ana sayfa</a>
          <a href="/#iletisim" class="btn btn-ghost magnetic">İletişime geç</a>
        </div>

        <nav class="hata__linkler" aria-label="Site bölümleri">
          <a href="/#hizmetler">Hizmetler</a>
          <a href="/rehber/">Rehber</a>
          <a href="/hizmetler/e-ticaret-paketleri/">E-ticaret paketleri</a>
          <a href="/hizmetler/seo/">SEO</a>
          <a href="/en/">English</a>
        </nav>
      </div>
    </div>
  </main>

  <!-- app.js burada yuklenmez: navigasyon, ilerleme cubugu ve yukari-cik
