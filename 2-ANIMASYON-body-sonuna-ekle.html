<!-- ================================================================
     Bu bloğu index.html dosyanın en altındaki </body> etiketinden
     HEMEN ÖNCE yapıştır. Mevcut hiçbir şeyi silme, sadece ekle.
     Renk paleti korunur (lacivert / altın / beyaz).
     ================================================================ -->
<style>
  /* --- Scroll ile yumuşak beliriş (kartlar & başlıklar) --- */
  .tf-reveal { opacity: 0; transform: translateY(34px); }
  .tf-reveal.tf-in {
    opacity: 1; transform: none;
    transition: opacity .7s cubic-bezier(.2,.8,.2,1), transform .7s cubic-bezier(.2,.8,.2,1);
  }

  /* --- .accent altın metinde ince, sürekli parıltı --- */
  .accent {
    background: linear-gradient(100deg, var(--gold) 0%, #FFD98A 45%, var(--gold) 60%, #FFD98A 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: tfShimmer 6s linear infinite;
  }
  @keyframes tfShimmer { 0% { background-position: 220% 0; } 100% { background-position: -20% 0; } }

  /* --- Menü linklerinde altın alt-çizgi animasyonu --- */
  .nav-links > a { position: relative; }
  .nav-links > a::after {
    content: ''; position: absolute; left: 0; bottom: -6px;
    width: 100%; height: 2px; background: var(--gold);
    transform: scaleX(0); transform-origin: right;
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .nav-links > a:hover::after { transform: scaleX(1); transform-origin: left; }

  /* --- Marka/hizmet kutularında ince altın kenar parlaması --- */
  .amazon-grid > div, .featured-cards > div {
    transition: border-color .3s ease, transform .3s ease, box-shadow .3s ease;
  }
  .amazon-grid > div:hover, .featured-cards > div:hover {
    transform: translateY(-4px);
    border-color: rgba(245,166,35,0.4) !important;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  @media (prefers-reduced-motion: reduce) {
    .tf-reveal { opacity: 1 !important; transform: none !important; }
    .accent { animation: none !important; }
  }
</style>

<script>
  /* jshint esversion: 6 */
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Beliriş verilecek öğeler (mevcut reveal'ı ezmeden yenilerini ekliyoruz)
    const targets = document.querySelectorAll(
      '.bento-card, .process-card, .faq-item, .section-header, .brand-grid > a, .case-study'
    );
    targets.forEach(el => el.classList.add('tf-reveal'));

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          // aynı anda görünenlere hafif kademeli gecikme
          e.target.style.transitionDelay = Math.min(i * 60, 240) + 'ms';
          e.target.classList.add('tf-in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -50px 0px' });

    targets.forEach(el => io.observe(el));
  })();
</script>
